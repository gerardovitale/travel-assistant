[project]
name = "fuel-dashboard"
version = "0.2.0"
description = "Spanish fuel prices dashboard"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn==0.34.0",
    "jinja2>=3.1",
    "duckdb==1.1.3",
    "google-cloud-storage==2.18.2",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "geopy==2.4.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "httpx>=0.27,<1",
    "slowapi>=0.1.9",
    "spain-fuel-fetcher",
    "mcp>=1.16,<2",
]

[tool.uv.sources]
spain-fuel-fetcher = { workspace = true }

[tool.pytest.ini_options]
# "../scripts" makes the idae_*.py ingest scripts importable from tests/test_idae_ingest_pipeline.py
# -- they're run via `cd fuel-dashboard && uv run python ../scripts/<script>.py` in practice, so this
# is the venv that already has their deps (pandas, httpx, google-cloud-storage).
pythonpath = ["app", "../scripts"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "jupyter>=1.1.1",
]

[tool.ty.environment]
# `pythonpath = [...]` above is pytest-only; ty needs the same first-party roots. "." lets the
# test modules resolve `tests.fixture`; "../scripts" matches the idae_*.py ingest scripts pytest
# can already import. The venv is the shared workspace one at the repo root.
root = ["./app", ".", "../scripts"]
python = "../.venv"

[tool.ty.rules]
# Demoted, not ignored — these still print, they just don't fail the build.
# `pd.DataFrame(columns=[...])` is reported because typeshed declares `list.index`'s `start` as
# positional-only while pandas' `SequenceNotStr` protocol requires it to accept a keyword. An
# upstream mismatch on correct pandas usage, ~26 call sites across the workspace. Restore to
# "error" once pandas/typeshed agree.
invalid-argument-type = "warn"

# Tests routinely index the `X | None` returns that services hand back — the assertion on the next
# line is the null check. Enforcing it here would mean rewriting every test around the checker.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
not-subscriptable = "ignore"
not-iterable = "ignore"
# Comparisons and round() over pandas scalars, whose stubs widen to unions the operators reject.
unsupported-operator = "ignore"
no-matching-overload = "ignore"

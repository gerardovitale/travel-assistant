[project]
name = "commodity-fetcher"
version = "0.1.0"
description = "Fetch, validate and transform external commodity-price data (e.g. FRED)"
requires-python = ">=3.13"
dependencies = [
    "pandas==2.3.3",
    "requests==2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commodity_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest"]

[tool.ty.environment]
root = ["./src", "."]
python = "../.venv"
